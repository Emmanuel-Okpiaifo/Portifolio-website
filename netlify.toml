[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  function = "leave-preview"
  path = "/leave-a-testimonial"

[[headers]]
  for = "/review-testimonials"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
